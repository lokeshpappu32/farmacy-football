services:
  - type: web
    name: farmacy-football
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: python scripts/seed.py && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: farmacy-football-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_CODE
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: FOOTBALL_DATA_API_TOKEN
        sync: false
      - key: FOOTBALL_DATA_COMPETITION
        value: WC
      - key: FOOTBALLDATA_IO_API_KEY
        sync: false
      - key: FOOTBALLDATA_IO_BASE_URL
        value: https://footballdata.io/api/v1
      - key: FOOTBALLDATA_IO_LEAGUE_IDS
        value: "50"
      - key: FOOTBALLDATA_IO_SEASON_ID
        value: "618"
      - key: FOOTBALLDATA_IO_LANG
        value: en
      - key: FOOTBALLDATA_IO_SYNC_ENABLED
        value: "true"

databases:
  - name: farmacy-football-db
    plan: starter
    databaseName: farmacy_football
    user: farmacy_user
    postgresMajorVersion: "16"
