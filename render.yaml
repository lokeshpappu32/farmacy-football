services:
  - type: web
    name: farmacy-football
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    preDeployCommand: python scripts/seed.py
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: farmacy-football-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_CODE
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SCHEDULER_ENABLED
        value: false
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: FOOTBALL_DATA_API_TOKEN
        sync: false
      - key: FOOTBALL_DATA_COMPETITION
        value: WC
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

databases:
  - name: farmacy-football-db
    plan: free
    databaseName: farmacy_football
    user: farmacy_user
    postgresMajorVersion: "16"
